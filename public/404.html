<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>VK Jewellers – Elegance That Lasts Forever</title>
    <script>
      // Single Page App redirect for GitHub Pages
      // If path starts with /vk-jewellers, keep 1 segment (the repo name), else 0 (custom domain / Hostinger)
      var pathSegmentsToKeep = window.location.pathname.startsWith('/vk-jewellers') ? 1 : 0;
      var l = window.location;
      var repoBase = l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');
      var subPath = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~');
      var target = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        repoBase + '/#/' + (subPath || '') +
        (l.search ? (subPath ? '&' : '?') + l.search.slice(1).replace(/&/g, '~and~') : '') +
        (l.hash ? l.hash : '');
      l.replace(target);
    </script>
  </head>
  <body>
  </body>
</html>
